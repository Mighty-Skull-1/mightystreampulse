<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightFeed - OBS Studio Overlay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --primary: var(--primary); --accent: var(--accent); --primary-rgb: 145, 70, 255; }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Alert Box Popup */
        .alert-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(18, 18, 24, 0.92);
            border: 2px solid var(--primary);
            box-shadow: 0 10px 40px rgba(var(--primary-rgb), 0.5);
            backdrop-filter: blur(8px);
            padding: 16px 28px;
            border-radius: 16px;
            z-index: 1000;
        }

        .alert-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .alert-icon {
            font-size: 2.5rem;
            color: var(--accent);
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }

        .alert-content h2 {
            font-size: 1.3rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff007f, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .alert-content p {
            font-size: 1.05rem;
            color: #efeff1;
            margin-top: 2px;
            font-weight: 600;
        }

        /* Big support alert (subs / bits / gifts / raids) */
        .support-alert {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.6); opacity: 0;
            transition: all 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 520px; max-width: 900px; text-align: center;
            background: rgba(14, 14, 20, 0.94);
            border: 3px solid var(--primary);
            box-shadow: 0 0 60px rgba(var(--primary-rgb), 0.65), inset 0 0 30px rgba(var(--primary-rgb), 0.25);
            border-radius: 22px; padding: 26px 40px 28px; z-index: 1100;
        }
        .support-alert.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .support-alert .s-icon { font-size: 4rem; color: var(--accent); animation: pulseIcon 0.8s infinite alternate; }
        @keyframes pulseIcon { from { transform: scale(1); } to { transform: scale(1.15); } }
        .support-alert .s-kicker { margin-top: 8px; font-size: 1rem; font-weight: 800; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
        .support-alert .s-title { margin-top: 4px; font-size: 2.6rem; font-weight: 900; color: #fff; line-height: 1.1; text-shadow: 0 0 18px rgba(var(--primary-rgb), 0.8); }
        .support-alert .s-title .who { color: var(--accent); }
        .support-alert .s-msg { margin-top: 12px; font-size: 1.25rem; color: #e6e6ef; font-weight: 600; font-style: italic; }
        .support-alert .s-msg:empty { display: none; }

        /* Live Chat Highlight Overlay */
        .chat-overlay-box {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .chat-card {
            background: rgba(15, 15, 20, 0.85);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 10px 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease forwards;
            font-size: 0.95rem;
            color: #fff;
            backdrop-filter: blur(6px);
        }

        .chat-card .sender {
            font-weight: 700;
            margin-right: 8px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Poll Overlay Widget */
        .poll-widget {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(18, 18, 24, 0.9);
            border: 1px solid #333344;
            border-radius: 12px;
            padding: 16px 20px;
            width: 320px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            display: none;
            backdrop-filter: blur(8px);
        }

        .poll-widget.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .poll-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .poll-opt {
            margin-bottom: 10px;
        }

        .poll-opt-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #ccc;
            margin-bottom: 4px;
        }

        .poll-bar-bg {
            height: 10px;
            background: #272733;
            border-radius: 5px;
            overflow: hidden;
        }

        .poll-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .overlay-setup-hint {
            display: none; position: fixed; left: 50%; top: 40%; transform: translateX(-50%);
            background: rgba(20, 14, 36, 0.92); color: #fff; padding: 18px 24px; border-radius: 12px;
            border: 1px solid var(--primary); font-size: 1.1rem; max-width: 640px; text-align: center;
        }
        #confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>
    <!-- Alert Popups -->
    <div class="alert-container" id="alertBox">
        <i class="fa-solid fa-bullhorn alert-icon" id="alertIcon"></i>
        <div class="alert-content">
            <h2 id="alertTitle">STREAM ALERT</h2>
            <p id="alertMsg">Welcome to the stream!</p>
        </div>
    </div>

    <!-- Big support alert -->
    <div class="support-alert" id="supportAlert">
        <i class="fa-solid fa-star s-icon" id="supportIcon"></i>
        <div class="s-kicker" id="supportKicker">NEW SUB</div>
        <div class="s-title" id="supportTitle"></div>
        <div class="s-msg" id="supportMsg"></div>
    </div>

    <!-- Live Poll Widget -->
    <div class="poll-widget" id="pollWidget">
        <div class="poll-title"><i class="fa-solid fa-chart-simple" style="color: var(--accent);"></i> <span id="pollQuestion">Chat Poll</span></div>
        <div id="pollOptionsList"></div>
    </div>

    <!-- On-Screen Chat Stream -->
    <div class="chat-overlay-box" id="chatOverlay"></div>

    <div class="overlay-setup-hint" id="setupHint">
        LightFeed overlay: add <b>?channel=yourchannel</b> to this link
        (copy it from the OBS Overlay Setup page in the dashboard).
    </div>
    <canvas id="confettiCanvas"></canvas>

    <script src="tmi.min.js"></script>
    <script>
        // ============================================================
        // LightFeed OBS overlay
        // Reads Twitch chat directly (anonymous, read-only), so it works
        // inside OBS from the Netlify site with no local server.
        // URL options:
        //   ?channel=mightyttv0   (required) channel to watch
        //   &bot=botusername      account the dashboard posts as
        //   &chat=0               hide the on-screen chat feed
        // ============================================================
        const params = new URLSearchParams(location.search);
        const CHANNEL = (params.get('channel') || '').toLowerCase().replace(/^#/, '').trim();
        const BOT = (params.get('bot') || CHANNEL).toLowerCase().replace(/^#/, '').trim();
        const SHOW_CHAT = params.get('chat') !== '0';
        const POINTS_FROM_BOT = params.get('pts') === '1'; // dashboard announces every redemption

        // Streamer theme colours from the link (?primary=hex&accent=hex)
        const THEME = { primary: '#9146ff', accent: '#00f0ff' };
        ['primary', 'accent'].forEach(k => {
            const v = (params.get(k) || '').replace('#', '');
            if (/^[0-9a-f]{6}$/i.test(v)) THEME[k] = '#' + v;
        });
        (function applyOverlayTheme() {
            const r = document.documentElement.style;
            r.setProperty('--primary', THEME.primary);
            r.setProperty('--accent', THEME.accent);
            const n = parseInt(THEME.primary.slice(1), 16);
            r.setProperty('--primary-rgb', [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(', '));
        })();

        const alertBox = document.getElementById('alertBox');
        const alertTitle = document.getElementById('alertTitle');
        const alertMsg = document.getElementById('alertMsg');
        const alertIcon = document.getElementById('alertIcon');
        const chatOverlay = document.getElementById('chatOverlay');
        const pollWidget = document.getElementById('pollWidget');
        const pollQuestion = document.getElementById('pollQuestion');
        const pollOptionsList = document.getElementById('pollOptionsList');

        function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

        // ---------- Alerts (queued so they never overwrite each other) ----------
        const alertQueue = [];
        let alertShowing = false;
        function showAlert(title, message, type) {
            alertQueue.push({ title, message, type });
            if (!alertShowing) nextAlert();
        }
        function nextAlert() {
            const a = alertQueue.shift();
            if (!a) { alertShowing = false; return; }
            alertShowing = true;
            if (a.big) { runSupportAlert(a); return; }
            alertTitle.textContent = a.title || 'STREAM ALERT';
            alertMsg.textContent = a.message || '';
            const icons = { giveaway: 'fa-gift', winner: 'fa-trophy', poll: 'fa-square-poll-vertical',
                            trivia: 'fa-brain', reward: 'fa-coins', hype: 'fa-fire' };
            alertIcon.className = 'fa-solid ' + (icons[a.type] || 'fa-bolt-lightning') + ' alert-icon';
            alertBox.classList.add('show');
            setTimeout(() => {
                alertBox.classList.remove('show');
                setTimeout(nextAlert, 600);
            }, 6000);
        }

        // ---------- Big support alerts with sound ----------
        const SOUND_ON = params.get('sound') !== '0';
        const VOLUME = Math.max(0, Math.min(1, parseFloat(params.get('volume') || '0.8')));
        const TTS_ON = params.get('tts') === '1';
        let actx = null;
        function tone(freq, start, dur, type, gain) {
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = type || 'sine'; o.frequency.setValueAtTime(freq, actx.currentTime + start);
            g.gain.setValueAtTime(0, actx.currentTime + start);
            g.gain.linearRampToValueAtTime((gain || 0.3) * VOLUME, actx.currentTime + start + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + start + dur);
            o.connect(g); g.connect(actx.destination);
            o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur + 0.05);
        }
        // Custom clip per alert type: &snd_sub=<url or /sounds/file.mp3>
        // Uploaded clips only play on the channel of the streamer who uploaded them
        const CUSTOM_SOUNDS = {};
        ['sub', 'bits', 'gift', 'raid', 'points'].forEach(k => {
            const v = (params.get('snd_' + k) || '').trim();
            const up = /^\/\.netlify\/functions\/sounds\?owner=([a-z0-9_]+)&id=[a-f0-9]{32}$/.exec(v);
            if (up) { if (up[1] === CHANNEL || up[1] === BOT) CUSTOM_SOUNDS[k] = v; return; }
            if (/^https:\/\/[^\s"'<>]+$/i.test(v)) CUSTOM_SOUNDS[k] = v;
        });
        // Preload so the clip starts instantly
        Object.values(CUSTOM_SOUNDS).forEach(u => { try { const a = new Audio(u); a.preload = 'auto'; } catch (e) {} });

        function playAlertSound(kind, done) {
            if (!SOUND_ON) { if (done) done(0); return; }
            if (CUSTOM_SOUNDS[kind]) {
                try {
                    const a = new Audio(CUSTOM_SOUNDS[kind]);
                    a.volume = VOLUME;
                    a.onended = () => done && done(0);
                    a.play().catch(() => { playSynth(kind); if (done) done(1400); });
                    return;
                } catch (e) {}
            }
            playSynth(kind);
            if (done) done(1400);
        }
        function playSynth(kind) {
            try {
                actx = actx || new (window.AudioContext || window.webkitAudioContext)();
                if (actx.state === 'suspended') actx.resume();
                if (kind === 'points') {        // soft chime
                    [1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.09, 0.5, 'sine', 0.3));
                } else if (kind === 'bits') {   // coin shower
                    [988, 1319, 1568, 1976, 2637].forEach((f, i) => tone(f, i * 0.07, 0.35, 'square', 0.12));
                } else if (kind === 'gift') {   // sparkle run
                    [784, 988, 1175, 1568, 1976, 2349, 3136].forEach((f, i) => tone(f, i * 0.06, 0.4, 'triangle', 0.22));
                } else if (kind === 'raid') {   // horn blast
                    [0, 0.35].forEach(t => { tone(220, t, 0.3, 'sawtooth', 0.25); tone(330, t, 0.3, 'sawtooth', 0.18); });
                    tone(440, 0.75, 0.7, 'sawtooth', 0.25);
                } else {                        // sub fanfare
                    [523, 659, 784].forEach((f, i) => tone(f, i * 0.13, 0.25, 'triangle', 0.3));
                    [523, 659, 784, 1047].forEach(f => tone(f, 0.42, 0.9, 'triangle', 0.2));
                }
            } catch (e) {}
        }
        function speak(text) {
            if (!TTS_ON || !text || !window.speechSynthesis) return;
            try {
                const u = new SpeechSynthesisUtterance(text.slice(0, 200));
                u.volume = VOLUME;
                speechSynthesis.speak(u);
            } catch (e) {}
        }
        function supportAlert(kind, kicker, who, rest, message) {
            alertQueue.push({ big: true, kind, kicker, who, rest, message });
            if (!alertShowing) nextAlert();
        }
        function runSupportAlert(a) {
            const icons = { bits: 'fa-gem', gift: 'fa-gift', raid: 'fa-people-group', sub: 'fa-star', points: 'fa-coins' };
            document.getElementById('supportIcon').className = 'fa-solid ' + (icons[a.kind] || 'fa-star') + ' s-icon';
            document.getElementById('supportKicker').textContent = a.kicker;
            document.getElementById('supportTitle').innerHTML = `<span class="who">${esc(a.who)}</span> ${esc(a.rest)}`;
            document.getElementById('supportMsg').textContent = a.message ? '“' + a.message + '”' : '';
            const box = document.getElementById('supportAlert');
            box.classList.add('show');
            if (a.kind !== 'points') confetti();
            const hold = a.kind === 'points' ? (a.message ? 7000 : 5000) : (a.message ? 9000 : 7000);
            // read the viewer's message once the alert sound has finished
            playAlertSound(a.kind, (wait) => setTimeout(() => speak(a.message), wait));
            setTimeout(() => { box.classList.remove('show'); setTimeout(nextAlert, 700); }, hold);
        }
        function tierText(plan) {
            if (!plan) return '';
            if (/prime/i.test(plan)) return ' with Prime';
            if (plan === '2000') return ' at Tier 2';
            if (plan === '3000') return ' at Tier 3';
            return '';
        }

        // ---------- Poll ----------
        let poll = null; // { question, options: [{text, voters:Set}] }
        let pollHideTimer = null;
        function renderPoll() {
            if (!poll) return;
            pollQuestion.textContent = poll.question;
            pollOptionsList.innerHTML = '';
            const counts = poll.options.map(o => o.voters.size);
            const total = counts.reduce((a, b) => a + b, 0) || 1;
            poll.options.forEach((opt, idx) => {
                const pct = Math.round((counts[idx] / total) * 100);
                const d = document.createElement('div');
                d.className = 'poll-opt';
                d.innerHTML = `
                    <div class="poll-opt-label">
                        <span>[${idx + 1}] ${esc(opt.text)}</span>
                        <span>${counts[idx]} (${pct}%)</span>
                    </div>
                    <div class="poll-bar-bg"><div class="poll-bar-fill" style="width:${pct}%"></div></div>`;
                pollOptionsList.appendChild(d);
            });
            pollWidget.classList.add('active');
        }
        function startPoll(question, optionTexts) {
            if (pollHideTimer) { clearTimeout(pollHideTimer); pollHideTimer = null; }
            poll = { question, options: optionTexts.map(t => ({ text: t, voters: new Set() })) };
            renderPoll();
            showAlert('NEW POLL', question + ' (type the number in chat to vote!)', 'poll');
        }
        function endPoll() {
            if (!poll) return;
            const best = poll.options.reduce((b, o) => (o.voters.size > b.voters.size ? o : b), poll.options[0]);
            if (best && best.voters.size > 0) showAlert('POLL RESULT', `${best.text} wins with ${best.voters.size} vote${best.voters.size === 1 ? '' : 's'}!`, 'poll');
            const ended = poll;
            poll = null;
            // leave the final results on screen briefly
            pollHideTimer = setTimeout(() => { if (!poll) pollWidget.classList.remove('active'); }, 8000);
            return ended;
        }
        function parsePollMessage(msg) {
            // "📊 POLL: question | Vote with a number: [1] A [2] B"
            const m = msg.match(/POLL:\s*(.+?)\s*\|\s*Vote with a number:\s*(.+)$/i);
            if (!m) return null;
            const opts = [];
            const re = /\[(\d+)\]\s*([^\[]+)/g;
            let r;
            while ((r = re.exec(m[2])) !== null) opts.push(r[2].trim());
            return opts.length ? { question: m[1], options: opts } : null;
        }

        // ---------- Chat feed ----------
        function showChat(name, color, message, isReward) {
            if (!SHOW_CHAT) return;
            const card = document.createElement('div');
            card.className = 'chat-card';
            if (isReward) card.style.cssText = 'border-left: 4px solid #ffd700; background: rgba(30, 25, 10, 0.9);';
            const tag = isReward ? '<span style="color:#ffd700;font-size:.75rem;font-weight:700;margin-right:6px;"><i class="fa-solid fa-coins"></i> POINTS</span>' : '';
            card.innerHTML = `${tag}<span class="sender" style="color:${esc(color)}">${esc(name)}:</span> <span>${esc(message)}</span>`;
            chatOverlay.appendChild(card);
            while (chatOverlay.children.length > 5) chatOverlay.removeChild(chatOverlay.firstChild);
            setTimeout(() => { if (card.parentNode) card.remove(); }, 10000);
        }

        // ---------- Confetti ----------
        const cv = document.getElementById('confettiCanvas');
        const cx = cv.getContext('2d');
        let pieces = [], confettiRunning = false;
        function resizeCanvas() { cv.width = innerWidth; cv.height = innerHeight; }
        addEventListener('resize', resizeCanvas); resizeCanvas();
        function confetti() {
            const colors = [THEME.primary, THEME.accent, '#ff2d95', '#ffd700', '#ffffff'];
            for (let i = 0; i < 180; i++) {
                pieces.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5,
                    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, vy: 3 + Math.random() * 4,
                    vx: -2 + Math.random() * 4, r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4,
                    c: colors[i % colors.length] });
            }
            if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(drawConfetti); }
        }
        function drawConfetti() {
            cx.clearRect(0, 0, cv.width, cv.height);
            pieces.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.r += p.vr;
                cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
                cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
            });
            pieces = pieces.filter(p => p.y < cv.height + 40);
            if (pieces.length) requestAnimationFrame(drawConfetti);
            else { confettiRunning = false; cx.clearRect(0, 0, cv.width, cv.height); }
        }

        // ---------- React to what the dashboard bot posts ----------
        function handleBotMessage(msg) {
            if (/POLL ENDED/i.test(msg)) { endPoll(); return; }
            const p = parsePollMessage(msg);
            if (p) { startPoll(p.question, p.options); return; }

            let m;
            if ((m = msg.match(/WINNER IS\.*\s*@?(\w+)/i))) {
                showAlert('GIVEAWAY WINNER', `Congratulations @${m[1]}!`, 'winner'); confetti(); return;
            }
            if (/GIVEAWAY STARTED/i.test(msg)) {
                const k = msg.match(/Type "([^"]+)"/i);
                showAlert('GIVEAWAY!', k ? `Type ${k[1]} in chat to enter!` : 'Enter in chat now!', 'giveaway'); return;
            }
            if ((m = msg.match(/TRIVIA TIME!\s*"(.+)"/i))) { showAlert('CHAT TRIVIA', m[1], 'trivia'); return; }
            if ((m = msg.match(/BINGO!\s*@?(\w+).*?answer:\s*"([^"]+)"/i))) {
                showAlert('TRIVIA WINNER', `@${m[1]} got it: ${m[2]}`, 'trivia'); confetti(); return;
            }
            if (/HYPE TRAIN|CELEBRATION ACTIVATED/i.test(msg)) { showAlert('HYPE!', "Let's go chat! 🔥", 'hype'); confetti(); return; }
            if ((m = msg.match(/CHANNEL POINTS:\s*(\S+) redeemed "([^"]+)"(?:\s+—\s+(.*))?/))) {
                supportAlert('points', 'CHANNEL POINTS', m[1], `redeemed ${m[2]}!`, (m[3] || '').trim()); return;
            }
            if (/OVERLAY TEST POINTS/i.test(msg)) { supportAlert('points', 'CHANNEL POINTS', 'TestViewer', 'redeemed Hydrate!', ''); return; }
            if (/OVERLAY TEST SUB/i.test(msg)) { supportAlert('sub', 'NEW SUB', 'TestViewer', 'just subscribed!', 'This is a test sub alert'); return; }
            if (/OVERLAY TEST BITS/i.test(msg)) { supportAlert('bits', 'CHEER', 'TestViewer', 'cheered 500 bits!', 'This is a test bits alert'); return; }
            if (/OVERLAY TEST GIFT/i.test(msg)) { supportAlert('gift', 'GIFT BOMB', 'TestViewer', 'gifted 5 subs to the community!'); return; }
            if (/OVERLAY TEST RAID/i.test(msg)) { supportAlert('raid', 'INCOMING RAID', 'TestStreamer', 'is raiding with 42 viewers!'); return; }
            if (/OVERLAY TEST/i.test(msg)) { showAlert('OVERLAY CONNECTED', 'Your LightFeed overlay is working ✅', 'alert'); confetti(); return; }
        }

        function handleViewerMessage(user, msg) {
            if (!poll) return;
            const n = parseInt(msg.trim(), 10);
            if (String(n) !== msg.trim() || n < 1 || n > poll.options.length) return;
            poll.options.forEach(o => o.voters.delete(user));
            poll.options[n - 1].voters.add(user);
            renderPoll();
        }

        // ---------- Connect ----------
        if (!CHANNEL) {
            document.getElementById('setupHint').style.display = 'block';
        } else if (window.tmi && tmi.Client) {
            const client = new tmi.Client({
                options: { skipUpdatingEmotesets: true },
                connection: { reconnect: true, secure: true, maxReconnectInterval: 15000 },
                channels: [CHANNEL] // no identity = anonymous read-only
            });
            client.on('message', (ch, tags, message) => {
                const login = (tags.username || '').toLowerCase();
                const name = tags['display-name'] || login;
                const isTrusted = login === BOT || login === CHANNEL;
                const isReward = !!tags['custom-reward-id'] || tags['msg-id'] === 'highlighted-message';
                if (isTrusted) handleBotMessage(message);
                if (!isTrusted || login === CHANNEL) handleViewerMessage(login, message);
                if (isReward && !POINTS_FROM_BOT) showAlert('CHANNEL POINTS', `${name}: ${message}`, 'reward');
                showChat(name, tags.color || '#9146FF', message, isReward);
            });
            const giftBombs = {}; // gifter -> remaining individual gifts to skip
            client.on('raided', (ch, user, viewers) => supportAlert('raid', 'INCOMING RAID', user, `is raiding with ${viewers} viewer${viewers == 1 ? '' : 's'}!`));
            client.on('subscription', (ch, user, methods, msg, tags) =>
                supportAlert('sub', 'NEW SUB', (tags && tags['display-name']) || user, 'just subscribed' + tierText(methods && methods.plan) + '!', msg));
            client.on('resub', (ch, user, _m, msg, tags, methods) => {
                const months = parseInt((tags && tags['msg-param-cumulative-months']) || _m || 0, 10);
                supportAlert('sub', 'RESUB', (tags && tags['display-name']) || user,
                    `resubscribed${months ? ' for ' + months + ' months' : ''}${tierText(methods && methods.plan)}!`, msg);
            });
            client.on('submysterygift', (ch, user, count, methods, tags) => {
                const key = (user || '').toLowerCase();
                giftBombs[key] = (giftBombs[key] || 0) + Number(count || 0);
                setTimeout(() => { delete giftBombs[key]; }, 20000);
                supportAlert('gift', 'GIFT BOMB', (tags && tags['display-name']) || user, `gifted ${count} sub${count == 1 ? '' : 's'} to the community!`);
            });
            client.on('subgift', (ch, user, streak, recipient, methods, tags) => {
                const key = (user || '').toLowerCase();
                if (giftBombs[key] > 0) { giftBombs[key]--; return; } // part of a gift bomb already shown
                supportAlert('gift', 'GIFTED SUB', (tags && tags['display-name']) || user, `gifted a sub to ${recipient}!`);
            });
            client.on('anonsubgift', (ch, streak, recipient) => supportAlert('gift', 'GIFTED SUB', 'Anonymous', `gifted a sub to ${recipient}!`));
            client.on('anonsubmysterygift', (ch, count) => supportAlert('gift', 'GIFT BOMB', 'Anonymous', `gifted ${count} subs to the community!`));
            client.on('giftpaidupgrade', (ch, user) => supportAlert('sub', 'SUB UPGRADE', user, 'is continuing their gifted sub!'));
            client.on('primepaidupgrade', (ch, user) => supportAlert('sub', 'SUB UPGRADE', user, 'upgraded from Prime!'));
            client.on('cheer', (ch, tags, msg) => {
                const bits = parseInt(tags.bits || '0', 10);
                const clean = (msg || '').replace(/\b[A-Za-z]+\d+\b/g, '').replace(/\s+/g, ' ').trim(); // strip Cheer100 tokens
                supportAlert('bits', bits >= 1000 ? 'MASSIVE CHEER' : 'CHEER', tags['display-name'] || tags.username, `cheered ${bits} bit${bits === 1 ? '' : 's'}!`, clean);
            });
            client.connect().catch(e => console.warn('Overlay chat connect failed', e));
        }

        // ---------- Local server mode (node server.js on your own PC) ----------
        if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
            try {
                const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`);
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'obs_alert') showAlert(data.title, data.message, data.alertType);
                };
            } catch (e) {}
        }
    </script>
</body>
</html>
